name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ============================================
# CI 门禁设计（与 make check 对齐，详见 docs/HARNESS_ENGINEERING.md §5.3）
# --------------------------------------------
# required job 集 = make check 全部阻断项：
#   lint           -> pre-commit run --all-files（ruff/black/isort/detect-secrets/prettier/eslint）
#                     单一真相源 = .pre-commit-config.yaml，CI 不再手写 lint，防漂移。
#                     bandit 此处 SKIP，独立成 security-scan job，避免重复。
#   type-check     -> mypy --strict（慢检查，不进 pre-commit，独立 required）
#   security-scan  -> bandit -ll -c .bandit（独立 required，阻断，带报告）
#   backend-unit-test / backend-integration-test -> pytest
#   frontend-test  -> vue-tsc --noEmit + vitest
#
# 5 个 bug 修复：
#   1. 前端无 lockfile           -> frontend/package-lock.json（npm ci 必需，已生成）
#   2. 工具版本未固定            -> 全部 pip install -r requirements(-dev).txt，禁裸 pip install
#   3. detect-secrets 无 baseline -> 走 pre-commit 钩子（自带 --baseline .secrets.baseline）
#   4. bandit || true 非阻断     -> 独立 required job，去 || true，用 -c .bandit -ll
#   5. CI 重复 lint 与 pre-commit 漂移 -> lint 改 pre-commit run --all-files
#
# 安装顺序（关键）：pre-commit 的前端钩子用 npx --no-install，必须 node_modules 已存在。
#   故 lint job 固定顺序：先 pip install + npm ci，再 pre-commit run --all-files。
# ============================================

jobs:
  # ============================================
  # Lint + 密钥扫描（单一真相源：.pre-commit-config.yaml）
  # ============================================
  lint:
    name: Lint & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dev tools
        run: pip install -r backend/requirements-dev.txt

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # 诊断：拆成每钩子一步，便于从 step 结论定位失败钩子（日志需认证，step 名匿名可见）
      - name: ruff
        run: pre-commit run ruff-check --all-files
      - name: black
        run: pre-commit run black-check --all-files
      - name: isort
        run: pre-commit run isort-check --all-files
      - name: detect-secrets
        run: pre-commit run detect-secrets --all-files
      - name: prettier
        run: pre-commit run prettier-check --all-files
      - name: eslint
        run: pre-commit run eslint --all-files

  # ============================================
  # 后端类型检查（独立 required job，慢检查不进 pre-commit）
  # ============================================
  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Type check (mypy --strict)
        run: mypy --strict app/

  # ============================================
  # 后端安全扫描（独立 required job，阻断，带报告）
  # ============================================
  security-scan:
    name: Security Scan (bandit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install bandit
        run: pip install -r requirements-dev.txt

      - name: Security scan (bandit)
        run: bandit -ll -c .bandit -r app/ -f json -o bandit-report.json

      - name: Upload bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # ============================================
  # 后端单元测试
  # ============================================
  backend-unit-test:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # tests/unit/ 未显式标 @pytest.mark.unit（仅 tests/integration/ 标了 integration），
        # 故用 "not integration" 选中全部非集成测试（即 tests/unit/），避免 -m unit 收集 0 个（exit 5）。
        run: pytest -m "not integration" -v --cov=app --cov-report=term-missing --cov-report=html:htmlcov
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          SECRET_KEY: "test-secret-key"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage-report
          path: backend/htmlcov/

  # ============================================
  # 后端集成测试
  # ============================================
  backend-integration-test:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_qa_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for PostgreSQL
        run: |
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5432 -U postgres; do
            echo "Waiting for PostgreSQL..."
            sleep 1
          done

      - name: Run integration tests
        run: pytest -m integration -v
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/rag_qa_test"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "test-secret-key"
          LLM_API_KEY: "test-llm-key"

  # ============================================
  # 前端类型检查 + 单元测试
  # ============================================
  frontend-test:
    name: Frontend Type Check & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit -- --run

  # ============================================
  # 端到端测试（仅 PR）
  # ============================================
  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit-test, frontend-test]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r requirements.txt
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright
        run: npx playwright install chromium
        working-directory: frontend

      - name: Start backend server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        working-directory: backend
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          SECRET_KEY: "test-secret-key"

      - name: Start frontend server
        run: |
          npm run build
          npm run preview -- --host --port 4173 &
          sleep 5
        working-directory: frontend

      - name: Run E2E tests
        run: npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
