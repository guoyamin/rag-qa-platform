name: 功能需求
description: 提一个新功能建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 什么场景下不方便/缺什么能力
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议的方案
      description: 你希望怎么实现
    validations:
      required: true
