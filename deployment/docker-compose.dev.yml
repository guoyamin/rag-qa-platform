name: rag_qa_platform

services:
  # === PostgreSQL ===
  postgres:
    image: postgres:16-alpine
    container_name: rag_qa_platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rag_qa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # === Redis ===
  redis:
    image: redis:7-alpine
    container_name: rag_qa_platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # === Milvus (简化版，开发用) ===
  etcd:
    container_name: rag_qa_platform-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd

  minio:
    container_name: rag_qa_platform-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    container_name: rag_qa_platform-milvus
    image: milvusdb/milvus:v2.4.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    # 不映射宿主端口：19530/9091 与宿主上其他 milvus 容器冲突
    # 后端通过 docker 内部网络（MILVUS_HOST=milvus）访问
    depends_on:
      - etcd
      - minio

  # === 后端开发服务 ===
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    image: deployment-backend:dev
    container_name: rag_qa_platform-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/rag_qa
      - REDIS_URL=redis://redis:6379/0
      - MILVUS_HOST=milvus
      - MILVUS_PORT=19530
      - DEBUG=true
      - SECRET_KEY=dev-secret-key-change-in-production
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
      - ../backend/pyproject.toml:/app/pyproject.toml
      - ../backend/pytest.ini:/app/pytest.ini
      - ../backend/requirements.txt:/app/requirements.txt
      - ../backend/requirements-dev.txt:/app/requirements-dev.txt
      - ../backend/.bandit:/app/.bandit
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus:
        condition: service_started

  # === 前端开发服务 ===
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    image: deployment-frontend:dev
    container_name: rag_qa_platform-frontend
    restart: unless-stopped
    # 启动时安装依赖（package.json 变化如新增 dompurify 会自动安装），再启动 dev server
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
      - ../frontend/index.html:/app/index.html
      - ../frontend/package.json:/app/package.json
      - ../frontend/vite.config.ts:/app/vite.config.ts
      - ../frontend/tsconfig.json:/app/tsconfig.json
      - ../frontend/tsconfig.node.json:/app/tsconfig.node.json
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
  etcd_data:
  minio_data:
  milvus_data:
